# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zsp.itsm.codemaster
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertError: true
        target:
          url: https://saphana2.s-pert.com:44360
          client: '100'
        app:
          name: ZSPF_CODEMASTER
          description: Code master
          package: ZSP_ITSM_CODEMASTER
          transport: SPDK903813
        exclude:
          - /test/
